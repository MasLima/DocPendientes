name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias de la API
        working-directory: api
        run: npm ci

      - name: Smoke test de la API
        working-directory: api
        run: |
          node src/server.js &
          sleep 8
          curl -s http://localhost:3000/api/health || exit 1

      - name: Instalar dependencias de la app
        working-directory: movil
        run: npm ci

      - name: Compilar la version web
        working-directory: movil
        run: npx expo export --platform web

      - name: Subir artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: movil/dist
          if-no-files-found: error

      - name: Subir artefacto api
        uses: actions/upload-artifact@v4
        with:
          name: api-src
          path: |
            api/
            !api/node_modules/
          if-no-files-found: error

  deploy:
    name: Despliegue al servidor
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Aviso de configuracion pendiente
        if: env.SSH_HOST == '' || env.SSH_HOST == null
        run: |
          echo "Secretos de despliegue no definidos."
          echo "Compilacion OK, artefactos publicados."
          echo "Para activar el despliegue ver docs/07_despliegue.md"

      - name: Configurar clave SSH
        if: env.SSH_HOST != '' && env.SSH_HOST != null
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Desplegar web estatica
        if: env.SSH_HOST != '' && env.SSH_HOST != null
        run: |
          scp -P "${SSH_PORT:-22}" -r movil/dist/* "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/web/"

      - name: Desplegar API y relanzar con PM2
        if: env.SSH_HOST != '' && env.SSH_HOST != null
        run: |
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "cd ${DEPLOY_PATH}/api && git pull origin main || true && npm ci --omit=dev && pm2 restart cobranza-api || pm2 start src/server.js --name cobranza-api"